<div class="modalForm">
                <h1>Оформити замовлення</h1>
                <button class="modalForm__closemodal" data-close-modal-form>⨉</button>
                <form class="modalForm__form">
                    <div class="formName">
                        <p>Name<span>*</span></p>
                        <input class="formName__input" type="text" placeholder="name">
                    </div>
                    <div class="formSurname">
                        <p>Surname<span>*</span></p>
                        <input class="formSurname__input" type="text" placeholder="surname">
                    </div>
                    <div class="formEmail">
                        <p>E-mail<span>*</span></p>
                        <input class="formEmail__input" type="text" placeholder="e-mail">
                    </div>
                    <div class="formPhone">
                        <p>Phone<span>*</span></p>
                        <input class="formPhone__input" type="text" placeholder="phone">
                    </div>
                    <div class="formAddress">
                        <p>Address<span>*</span></p>
                        <input class="formAddress__input" type="text" placeholder="address">
                    </div>
                    <div class="formCookies">
                        <input class="formCookies__checkbox" type="checkbox"></input>
                        <p>Я погоджуюся з умовами використання <a href="">файлів cookie</a></p>
                    </div>
                    <button class="modalForm__button">Оформити замовлення</button>
                </form>
            </div>
